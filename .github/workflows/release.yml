name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libdbus-1-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package release artifact
        run: |
          TAR_DIR="lyre-${{ matrix.target }}"
          mkdir -p "$TAR_DIR"
          cp "target/${{ matrix.target }}/release/lyre" "$TAR_DIR/"
          cp README.md "$TAR_DIR/"
          tar -czf "${TAR_DIR}.tar.gz" -C "$TAR_DIR" lyre README.md
          sha256sum "${TAR_DIR}.tar.gz" > "${TAR_DIR}.tar.gz.sha256"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lyre-${{ matrix.target }}.tar.gz
            lyre-${{ matrix.target }}.tar.gz.sha256
